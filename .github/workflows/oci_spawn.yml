name: Continuous OCI Instance Provisioning loop

on:
  schedule:
    # This runs the task every 5 minutes (GitHub's safety limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # This allows you to click a button and start it manually

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Oracle Cloud Infrastructure CLI Engine
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure Authentication Profile Keys
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Execution Cycle (Spam Attempt 60-Second Loop)
        run: |
          echo "Starting the continuous 5-minute automated window via Oracle Stack..."
          for i in {1..4}
          do
            echo "Attempting stack execution deployment $i..."
            
            # This triggers Oracle's Resource Manager to run your saved architecture layout
            RESPONSE=$(oci resource-manager job create \
              --stack-id "${{ secrets.OCI_STACK_ID }}" \
              --operation APPLY \
              --display-name "GitHub-Automated-Spam-Attempt-$i" 2>&1 || true)
                          
            echo "Server Response Log: $RESPONSE"
                        
            # Resource manager returns 'ACCEPTED' or 'SUCCEEDED' when it successfully initializes a job
            if [[ "$RESPONSE" == *"ACCEPTED"* || "$RESPONSE" == *"SUCCEEDED"* ]]; then
              echo "SUCCESS! Oracle Stack has accepted the execution plan."
              exit 0
            else
              echo "Request failed or out of capacity. Resting 60 seconds before retrying..."
              sleep 60
            fi
          done
