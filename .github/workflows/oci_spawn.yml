name: Continuous OCI Python SDK Provisioner Loop
on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 5 minutes automatically
  workflow_dispatch:       # Allows manual execution triggers

concurrency:
  group: oci-node-provisioner
  cancel-in-progress: false

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK Requirements
        run: pip install -r requirements.txt

      - name: Execute Python Provisioning Engine
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_COMPARTMENT_ID: ${{ vars.OCI_COMPARTMENT_ID }}
          OCI_IMAGE_OS: ${{ vars.OCI_IMAGE_OS }}
          OCI_IMAGE_OS_VERSION: ${{ vars.OCI_IMAGE_OS_VERSION }}
          OCI_SHAPE: ${{ vars.OCI_SHAPE }}
          OCI_OCPUS: ${{ vars.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ vars.OCI_MEMORY_IN_GBS }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ vars.OCI_BOOT_VOLUME_SIZE_IN_GBS }}
          OCI_AVAILABILITY_DOMAINS: ${{ vars.OCI_AVAILABILITY_DOMAINS }}
          OCI_DISPLAY_NAME: ${{ vars.OCI_DISPLAY_NAME }}
          OCI_SKIP_EXISTING_INSTANCE_CHECK: ${{ vars.OCI_SKIP_EXISTING_INSTANCE_CHECK }}
          OCI_ASSIGN_PUBLIC_IP: ${{ vars.OCI_ASSIGN_PUBLIC_IP }}
          OCI_TOTAL_ATTEMPTS: ${{ vars.OCI_TOTAL_ATTEMPTS }}
          OCI_RETRY_SLEEP_SECONDS: ${{ vars.OCI_RETRY_SLEEP_SECONDS }}
          OCI_ALLOW_PAID_LIMITS: ${{ vars.OCI_ALLOW_PAID_LIMITS }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }} 
        run: python provisioner/bot.py
